name: Deployment

on:
  push:
    branches:
      - "main"
    tags-ignore:
      - "*"
    paths-ignore:
      - "**.md"
      - ".vscode/**"
      - ".devcontainer/**"

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        dotnet: [10.0.403]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Install appstreamcli
        run: sudo apt-get install -y appstream
      - name: Restore
        run: dotnet run restore
      - name: Build
        run: dotnet run build
      - name: Run tests
        run: dotnet run test
      - name: Run publishing script
        run: dotnet run publish 0
      # For now I simply make a continuous build
      - name: Release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest > /dev/null 2>&1; then
            gh release delete latest --cleanup-tag --yes
          fi
          gh release create latest --prerelease --title "Continuous Build" --target "$GITHUB_SHA" README.md publish/*
