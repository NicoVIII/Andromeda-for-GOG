name: Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        dotnet: [10.0.403]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Get version from tag
        id: tag_name
        run: |
          if [[ ${GITHUB_REF} == *"-"* ]]; then
            RTAG=Unreleased
          else
            RTAG=${GITHUB_REF#refs/tags/v}
          fi
          echo "current_version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RTAG" >> "$GITHUB_OUTPUT"
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Install appstreamcli
        run: sudo apt-get install -y appstream
      - name: Restore
        run: dotnet run restore
      - name: Publish
        run: dotnet run publish ${{ steps.tag_name.outputs.current_version }}
      - name: Get Changelog Entry
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ steps.tag_name.outputs.release_tag }}
          path: ./CHANGELOG.md
      - name: Create release with binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.changelog_reader.outputs.changes }}
          PRERELEASE: ${{ steps.changelog_reader.outputs.status == 'unreleased' }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "$NOTES" --prerelease="$PRERELEASE" README.md publish/*
